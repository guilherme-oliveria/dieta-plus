databaseChangeLog:
  - changeSet:
      id: 065-prescricao-suplemento
      author: dietamais
      comment: "BE-75 (H-05). Cópia congelada de nome e dose; a lista de coleções do diário inclui já ORIENTACOES e DOCUMENTOS (BE-76 e BE-78)."
      changes:
        - createTable:
            tableName: prescricao_suplemento
            columns:
              - column: { name: id, type: uuid, defaultValueComputed: uuidv7(), constraints: { primaryKey: true, nullable: false } }
              - column: { name: vinculo_id, type: uuid, constraints: { nullable: false } }
              - column: { name: nutricionista_id, type: uuid, constraints: { nullable: false } }
              - column: { name: paciente_id, type: uuid, constraints: { nullable: false } }
              - column: { name: produto_id, type: uuid }
              - column: { name: nome, type: varchar(120), constraints: { nullable: false } }
              - column: { name: dose, type: varchar(80), constraints: { nullable: false } }
              - column: { name: forma, type: varchar(60) }
              - column: { name: frequencia, type: varchar(120) }
              - column: { name: horarios, type: varchar(60), defaultValue: "", constraints: { nullable: false } }
              - column: { name: inicio, type: date, constraints: { nullable: false } }
              - column: { name: fim, type: date }
              - column: { name: versao, type: bigint, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: seq, type: bigint, defaultValueComputed: "nextval('seq_sync')", constraints: { nullable: false } }
              - column: { name: criado_em, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: atualizado_em, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: excluido_em, type: timestamptz }
        - addForeignKeyConstraint:
            baseTableName: prescricao_suplemento
            baseColumnNames: vinculo_id,nutricionista_id
            referencedTableName: vinculo
            referencedColumnNames: id,nutricionista_id
            constraintName: fk_suplemento_vinculo_proprio
            onDelete: CASCADE
        - createIndex:
            tableName: prescricao_suplemento
            indexName: ix_suplemento_paciente
            columns:
              - column: { name: paciente_id }
              - column: { name: criado_em }
        - createIndex:
            tableName: prescricao_suplemento
            indexName: ix_suplemento_nutri
            columns:
              - column: { name: nutricionista_id }
        - sql:
            sql: >-
              ALTER TABLE prescricao_suplemento ADD CONSTRAINT ck_suplemento_periodo CHECK (fim IS NULL OR fim >= inicio);
              ALTER TABLE diario_sync DROP CONSTRAINT ck_diario_sync_colecao;
              ALTER TABLE diario_sync ADD CONSTRAINT ck_diario_sync_colecao CHECK (colecao IN
              ('PACIENTES','VINCULOS','NUTRIS','GRUPOS','ALIMENTOS','LISTAS','DIETAS','SNAPSHOTS','DIETA_EM_USO','CHECKINS','AGUA','PESOS','AVALIACOES','MODELOS','QUESTIONARIOS','CONSULTAS','AVISOS','PROTOCOLOS','MODELOS_DIETA','PRODUTOS','FORA_DO_PLANO','METAS','REGISTROS_META','SUPLEMENTOS','ORIENTACOES','DOCUMENTOS'));
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION suplemento_diario_sync() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                PERFORM registrar_mudanca_sync('NUTRICIONISTA',NEW.nutricionista_id,'SUPLEMENTOS',NEW.id,NEW.nutricionista_id,NEW.paciente_id);
                PERFORM registrar_mudanca_sync('PACIENTE',NEW.paciente_id,'SUPLEMENTOS',NEW.id,NEW.nutricionista_id,NEW.paciente_id);
                RETURN NEW;
              END;
              $$;
        - sql:
            sql: >-
              CREATE TRIGGER suplemento_diario_sync AFTER INSERT OR UPDATE ON prescricao_suplemento FOR EACH ROW EXECUTE FUNCTION suplemento_diario_sync();
