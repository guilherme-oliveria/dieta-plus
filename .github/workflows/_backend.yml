# Testes e build do backend (pasta backend/). O Testcontainers precisa do Docker do runner (já vem no ubuntu-latest).
name: backend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Backend (build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: backend
      - name: Testes (Postgres 18 via Testcontainers)
        run: ./gradlew build
