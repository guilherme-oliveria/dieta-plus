# Testes e builds do app (pasta mobile/). O iOS só roda quando ios=true (release): pedido do Guilherme em 04/11/2026.
name: mobile

on:
  workflow_call:
    inputs:
      ios:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-desktop:
    name: Mobile (Android e desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mobile
      - name: Testes (Android host e desktop)
        run: ./gradlew :shared:testAndroidHostTest :shared:jvmTest
      - name: Build do app Android
        run: ./gradlew :androidApp:assembleDebug
      - name: Build do app desktop
        run: ./gradlew :desktopApp:compileKotlin

  web:
    name: Mobile (web wasmJs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mobile
      - name: Build da web
        run: ./gradlew :webApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: mobile/webApp/build/dist/wasmJs/productionExecutable/

  ios:
    name: Mobile (iOS)
    if: inputs.ios
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mobile
      - name: Testes no simulador iOS
        run: ./gradlew :shared:iosSimulatorArm64Test
